# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds every board target on a version tag and attaches them to the release.
#
# The asset NAMES are load-bearing: firmware/components/ota/ota.c asks GitHub
# for the latest release and installs the asset called
# ups-adaptor-<target>.bin, where target comes from BOARD_OTA_TARGET. Rev A
# OLED shares Rev A's PCB and pin map but is a separate identity on purpose,
# so a plain Rev A board is never offered a build that assumes a display is
# fitted and a board running that build is never silently offered a plain
# release that leaves its screen dark. Rev B's pin map differs outright -- a
# Rev A image on it drives a VBUS enable that is not there, and a Rev B image
# on Rev A never raises VBUS, so the UPS never enumerates. Renaming any of
# these silently breaks updates, or worse, installs the wrong one.
#
# Devices follow releases, not branches: publishing one is the only thing that
# moves them, so a push that was never meant for hardware cannot reach any.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the app version comes from git describe

      # ESP-IDF stamps the image with `git describe`. In a container the checkout
      # belongs to another uid and git refuses to read it as "dubious
      # ownership", which silently stamps the image "1" instead of the tag --
      # and a device comparing "1" to the tag would re-offer this release
      # forever.
      - name: let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Each target gets its OWN build directory, and names its SDKCONFIG_DEFAULTS
      # explicitly. Both matter. ESP-IDF reads SDKCONFIG_DEFAULTS only when
      # generating sdkconfig, so a leftover sdkconfig makes the next target
      # inherit the previous board -- and because CMake CACHES SDKCONFIG_DEFAULTS
      # per build directory, deleting sdkconfig while reusing a directory
      # regenerates the SAME config from the cached value. Relying on Rev A
      # being built first, into a fresh directory, would make the correctness of
      # a shipped image depend on the ORDER of two steps in this file.
      # That shipped: ups-adaptor-freenove.bin was a Rev A build under the
      # devkit's name, a devkit installed it, and came up believing it had a
      # load switch on GPIO4.
      - name: build Rev A
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          rm -f firmware/sdkconfig
          idf.py -C firmware -B firmware/build \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" \
                 -DUPSA_IMAGE_NAME=ups-adaptor-reva \
                 -DPROJECT_VER="${GITHUB_REF_NAME}" build
          cp firmware/build/ups-adaptor-reva.bin ups-adaptor-reva.bin
          # The ELF, so a crash a board records (components/crashlog) can be
          # decoded against exactly the build it happened in.
          cp firmware/build/ups-adaptor-reva.elf ups-adaptor-reva.elf
          # A SINGLE-FILE image, flashable at 0x0 with no offsets to get wrong.
          # The app binary alone is only installable onto a board that already
          # has a bootloader, a partition table and an otadata -- which a board
          # fresh from the fab does not. Publishing only the app means the
          # documented "first flash" command produces a board that does
          # nothing, and the three files needed to fix that are not in the
          # release at all.
          python -m esptool --chip esp32s3 merge_bin \
            -o ups-adaptor-reva-full.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            0x0     firmware/build/bootloader/bootloader.bin \
            0x8000  firmware/build/partition_table/partition-table.bin \
            0xf000  firmware/build/ota_data_initial.bin \
            0x20000 firmware/build/ups-adaptor-reva.bin

      # Rev A OLED: the same PCB and pin map as plain Rev A, built as its own
      # board identity for a VCC-first display module fitted in J3. Its own
      # build directory and sdkconfig, for the reason above. This is what
      # makes it safe to give this build to someone else instead of hand-
      # flashing every board at a bench: a plain Rev A board can never be
      # offered it, and it can never be silently downgraded to a plain Rev A
      # release that would leave its screen dark, because the OTA client
      # only ever compares an image against its own board identity.
      - name: build Rev A OLED
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware -B firmware/build-reva-oled \
                 -DSDKCONFIG="$PWD/firmware/build-reva-oled/sdkconfig" \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.reva-oled" \
                 -DUPSA_IMAGE_NAME=ups-adaptor-reva-oled \
                 -DPROJECT_VER="${GITHUB_REF_NAME}" build
          cp firmware/build-reva-oled/ups-adaptor-reva-oled.bin ups-adaptor-reva-oled.bin
          cp firmware/build-reva-oled/ups-adaptor-reva-oled.elf ups-adaptor-reva-oled.elf
          python -m esptool --chip esp32s3 merge_bin \
            -o ups-adaptor-reva-oled-full.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            0x0     firmware/build-reva-oled/bootloader/bootloader.bin \
            0x8000  firmware/build-reva-oled/partition_table/partition-table.bin \
            0xf000  firmware/build-reva-oled/ota_data_initial.bin \
            0x20000 firmware/build-reva-oled/ups-adaptor-reva-oled.bin

      # Rev B: the same tree with sdkconfig.defaults.revb layered on -- 16 MB
      # flash, octal PSRAM, its own partition table -- and Tailscale, which every
      # Rev B release includes (owner, 2026-10-11; off on a board until a key is
      # entered on its page). Its own build directory and sdkconfig, for the
      # reason above. board.h refuses a Rev B build that did not load the overlay.
      - name: build Rev B
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware -B firmware/build-revb \
                 -DSDKCONFIG="$PWD/firmware/build-revb/sdkconfig" \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.revb;sdkconfig.defaults.tailscale" \
                 -DUPSA_IMAGE_NAME=ups-adaptor-revb \
                 -DPROJECT_VER="${GITHUB_REF_NAME}" build
          grep -qa "Tailscale starting as" firmware/build-revb/ups-adaptor-revb.bin || {
            echo "::error::the Rev B image has no Tailscale; every Rev B release carries it"; exit 1; }
          cp firmware/build-revb/ups-adaptor-revb.bin ups-adaptor-revb.bin
          # the ELF too: a crash on a Rev B board decodes against exactly this build
          cp firmware/build-revb/ups-adaptor-revb.elf ups-adaptor-revb.elf
          python -m esptool --chip esp32s3 merge_bin \
            -o ups-adaptor-revb-full.bin \
            --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x0     firmware/build-revb/bootloader/bootloader.bin \
            0x8000  firmware/build-revb/partition_table/partition-table.bin \
            0xf000  firmware/build-revb/ota_data_initial.bin \
            0x20000 firmware/build-revb/ups-adaptor-revb.bin

      # Gates. Each one exists because its absence shipped something that would
      # have needed a person and a cable to recover. They FAIL the release
      # rather than warn: a warning in a log nobody reads is not a gate.
      - name: gate -- rollback must be compiled in
        shell: bash
        run: |
          for c in firmware/sdkconfig firmware/build-reva-oled/sdkconfig firmware/build-revb/sdkconfig; do
            if ! grep -q "^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y" "$c"; then
              echo "::error::rollback is NOT enabled in $c."
              echo "::error::Without it a bad image cannot revert, and this project"
              echo "::error::has already shipped two images that boot-looped."
              exit 1
            fi
          done
          echo "rollback: enabled"

      - name: gate -- no bench-only options in a release
        shell: bash
        run: |
          if grep -q "^CONFIG_UPSA_CRASH_TEST=y" firmware/sdkconfig firmware/build-reva-oled/sdkconfig firmware/build-revb/sdkconfig; then
            echo "::error::a release image has the crash-test switch on: it would crash every board"
            exit 1
          fi
          # UPSA_REVA_OLED_VCC_FIRST drives a display on plain Rev A, which is
          # safe only with a VCC-first module. Shipped there it would invite a
          # customer to plug in a standard module -- which Rev A powers
          # backwards. Deliberately NOT checked against build-reva-oled: that
          # target exists precisely to carry this set, under its own board
          # identity, which is what makes it safe.
          if grep -q "^CONFIG_UPSA_REVA_OLED_VCC_FIRST=y" firmware/sdkconfig firmware/build-revb/sdkconfig; then
            echo "::error::a release image has the Rev A OLED display option set outside the reva-oled target"
            exit 1
          fi
          # A hub build reads several UPSes through a USB hub. It is a bench and
          # internal test build ONLY (CLAUDE.md, "The hub build is never a
          # release"): on the ESP32-S3 it needs a USB-host workaround and has
          # had very little testing. A release image reads exactly one UPS.
          for c in firmware/sdkconfig firmware/build-reva-oled/sdkconfig firmware/build-revb/sdkconfig; do
            n=$(sed -n 's/^CONFIG_UPSA_MAX_UPS=//p' "$c")
            if [ -n "$n" ] && [ "$n" != "1" ]; then
              echo "::error::$c reads $n UPSes (CONFIG_UPSA_MAX_UPS): a hub build is never a release"
              exit 1
            fi
          done
          echo "no bench-only options"

      - name: gate -- the image must fit with room to grow
        shell: bash
        run: |
          # Slot sizes from partitions.csv (Rev A, and Rev A OLED which shares
          # it) and partitions-revb.csv.
          for pair in ups-adaptor-reva.bin:$((0x1F0000)) \
                      ups-adaptor-reva-oled.bin:$((0x1F0000)) \
                      ups-adaptor-revb.bin:$((0x300000)); do
            f="${pair%%:*}"; slot="${pair#*:}"
            sz=$(stat -c%s "$f")
            pct=$((sz * 100 / slot))
            echo "$f: $sz bytes, ${pct}% of the $slot-byte slot"
            # 80% is the line: an OTA writes the OTHER slot, so an image that
            # nearly fills one still installs -- but nothing is left for the
            # growth that put it there.
            if [ "$pct" -ge 80 ]; then
              echo "::error::$f fills ${pct}% of its partition"; exit 1
            fi
          done

      - name: gate -- each image must BE the board it is named for
        shell: bash
        run: |
          # v0.02c shipped one board's build under the other's name when there
          # were two, and now there are three. A plain Rev A board must never
          # install a Rev B image: its N4 has a quarter of the flash that
          # image's partition table describes. A plain Rev A board must never
          # install the OLED image either, and a board running the OLED image
          # must never be silently downgraded to a plain Rev A build that
          # leaves its screen dark. Identity is checked from two independent
          # places -- the app descriptor's project name, which the OTA client
          # also enforces on-device, and the BOARD_NAME string the firmware
          # prints.
          fail=0
          for pair in "ups-adaptor-reva.bin:ups-adaptor-reva:My UPS Pal Rev A" \
                      "ups-adaptor-reva-oled.bin:ups-adaptor-reva-oled:My UPS Pal Rev A (OLED)" \
                      "ups-adaptor-revb.bin:ups-adaptor-revb:My UPS Pal Rev B"; do
            f="${pair%%:*}"; rest="${pair#*:}"; want="${rest%%:*}"; board="${rest#*:}"
            name=$(python3 -c "import sys;d=open(sys.argv[1],'rb').read();print(d[0x50:0x70].split(b'\0')[0].decode())" "$f")
            echo "  $f: project_name=$name"
            [ "$name" = "$want" ] || { echo "::error::$f declares '$name', expected '$want'"; fail=1; }
            grep -qa "$board" "$f" || { echo "::error::$f does not contain '$board'"; fail=1; }
            for other in "My UPS Pal Rev A" "My UPS Pal Rev A (OLED)" "My UPS Pal Rev B"; do
              # "Rev A" is a substring of "Rev A (OLED)"'s own correct name, so
              # skip whenever $other is contained IN $board, not just equal to
              # it -- otherwise the OLED image would always fail against its
              # own name.
              [[ "$board" == *"$other"* ]] && continue
              ! grep -qa "$other" "$f" || { echo "::error::$f also contains '$other'"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "each image is the board it claims to be"

      # The version a device compares against is the one baked into the image.
      # If it does not match the tag, every device installs this release and
      # still believes it needs it -- offered it forever.
      #
      # The builds above stamp it from the tag itself (-DPROJECT_VER), not from
      # `git describe`. v0.06 was tagged on the commit v0.06-rc2 was already on,
      # describe picked the rc tag, and both images shipped saying v0.06-rc2.
      #
      # And this check FAILS when it cannot read a version. It used to pass: it
      # grepped esptool for "Project version" (esptool prints "App version")
      # in firmware/build/ups-adaptor.bin (renamed long ago), read nothing,
      # and treated nothing as a match -- so it had never checked anything,
      # and it waved v0.06 through. The descriptor is now read directly from
      # each PUBLISHED file: esp_app_desc_t sits right after the 24-byte image
      # header and the first 8-byte segment header, magic 0xABCD5432, version
      # at +16 and project name at +48, 32 bytes each.
      - name: check each image's version matches the tag
        shell: bash
        run: |
          python3 - "${GITHUB_REF_NAME}" ups-adaptor-reva.bin ups-adaptor-reva-oled.bin ups-adaptor-revb.bin <<'PY'
          import struct, sys
          tag, bad = sys.argv[1], 0
          for f in sys.argv[2:]:
              d = open(f, 'rb').read()
              magic = struct.unpack_from('<I', d, 32)[0] if len(d) > 112 else 0
              ver = d[48:80].split(b'\0')[0].decode(errors='replace') if magic == 0xABCD5432 else ''
              print(f"{f}: tag={tag} image={ver or 'UNREADABLE'}")
              if ver != tag:
                  print(f"::error::{f} says '{ver or 'unreadable'}', tag is '{tag}'. Devices "
                        "compare the two, so every board would be offered this forever.")
                  bad = 1
          sys.exit(bad)
          PY

      # A tag containing -rc is published as a PRERELEASE. GitHub's
      # /releases/latest excludes prereleases, and that is the endpoint every
      # device asks -- so a release candidate is invisible to the fleet by
      # construction, and can be flashed to a bench board by hand without any
      # risk of a field device taking it.
      - name: is this a release candidate?
        id: rc
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-dev*) echo "pre=true"  >> "$GITHUB_OUTPUT"; echo "pre-release: only dev (and, when named, debug) boards see this";;
            *)     echo "pre=false" >> "$GITHUB_OUTPUT"; echo "production release: every device will be offered this";;
          esac

      # Checksums, so a download can be checked rather than trusted. The OTA
      # client verifies the image's own descriptor before it writes a byte, but
      # someone flashing by hand over USB has nothing to check against.
      - name: checksums
        shell: bash
        run: |
          sha256sum ups-adaptor-*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The release page's text, and what a board's update card shows. The
      # annotated tag's own message goes under "## What changed" -- the board
      # abridges the bullets there (firmware/components/ota/ota_notes.c) and
      # links here for the rest -- then the fixed instructions below it.
      #
      # generate_release_notes is off: the public repository is one orphan
      # commit per publish, so GitHub's generated changelog is always a single
      # useless line, and every byte of this body is also a byte a board must
      # download and parse on each check.
      - name: release notes from the tag
        shell: bash
        run: |
          # actions/checkout can leave a tag that triggered the run as a
          # lightweight ref; fetch the annotated object so its message exists.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)')
          if [ -z "$(printf '%s' "$notes" | grep -E '^[[:space:]]*[-*] ')" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} has no bullet list in its message."
            echo "::error::The update card shows those bullets; write the release notes in the tag."
            exit 1
          fi
          {
            # A tag message that brings its own "## What changed" heading (an
            # introduction above it) is used as written; otherwise it goes
            # under one. The board abridges the bullets after that heading.
            if printf '%s' "$notes" | grep -q '^## What changed'; then
              printf '%s\n\n---\n\n' "$notes"
            else
              printf '## What changed\n\n%s\n\n---\n\n' "$notes"
            fi
            cat <<'STATIC'
          **Updating a board that is running:** open its web page, go to
          Firmware, and press Check for updates. The board installs the file
          for its own target into the spare slot and runs it after a restart.
          If the new image does not come back, the bootloader reverts to the
          previous one by itself.

          **First flash, over USB: use the `-full` image.** It holds the
          bootloader, partition table, OTA selector and application, and goes
          to offset 0:

          ```
          esptool.py --chip esp32s3 write_flash 0x0 ups-adaptor-reva-full.bin
          ```

          The plain `.bin` files are the application only, at offset `0x20000`.
          They are what the board downloads when it updates itself.

          `ups-adaptor-reva*` is Rev A, `ups-adaptor-reva-oled*` is Rev A with
          the OLED fitted, `ups-adaptor-revb*` is Rev B. Every image names its
          board, and a board refuses anything that is not its own.
          `SHA256SUMS.txt` covers every binary.
          STATIC
          } > release-notes.md
          # Boards on v0.06 and earlier read GitHub's whole release response
          # into 16 KB, and a response that does not fit fails to parse -- they
          # would stop seeing updates at all, including the one that fixes it.
          # The rest of the response is about 8 KB; the notes must leave room.
          sz=$(wc -c < release-notes.md)
          echo "release notes: $sz bytes"
          if [ "$sz" -gt 3600 ]; then
            echo "::error::release notes are $sz bytes; keep them under 3600 so older boards can still read the release"
            exit 1
          fi

      # The ELFs decode a crash a board records (components/crashlog), so they
      # are kept, but NOT as release assets: every asset adds ~2.4 KB to the
      # release JSON a board reads into a 24 KB buffer. v0.16-rc2 had 13 assets,
      # served 31 KB, and no board could read it (dev boards said "the release
      # information is too large to read"; production boards on v0.15.x would
      # have been stranded the same way). Nine assets is about 22 KB.
      - name: keep the ELFs
        uses: actions/upload-artifact@v4
        with:
          name: elfs-${{ github.ref_name }}
          retention-days: 365
          path: |
            ups-adaptor-reva.elf
            ups-adaptor-reva-oled.elf
            ups-adaptor-revb.elf

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.rc.outputs.pre }}
          files: |
            ups-adaptor-reva.bin
            ups-adaptor-reva-full.bin
            ups-adaptor-reva-oled.bin
            ups-adaptor-reva-oled-full.bin
            ups-adaptor-revb.bin
            ups-adaptor-revb-full.bin
            SHA256SUMS.txt
          body_path: release-notes.md

      # What a board will actually receive. Boards cap the response at 24 KB
      # (v0.15.x and later). Nine assets and the usual notes measured 22621 on
      # v0.16-rc3; 24000 keeps about 0.5 KB in hand.
      - name: gate -- the release JSON must fit a board's buffer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sz=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | wc -c)
          echo "release JSON as a board reads it: $sz bytes (limit 24000)"
          if [ "$sz" -gt 24000 ]; then
            echo "::error::the release JSON is $sz bytes; boards read at most 24576, so some would see no update. Remove an asset."
            exit 1
          fi
