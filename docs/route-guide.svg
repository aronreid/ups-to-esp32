<text x="10" y="249.4" font-size="4" font-weight="bold" fill="#111">To fix: 0 connections to route, 0 floating grounds</text>
<text x="10" y="256.9" font-size="2.7" fill="#667">Solid marker = pad on the FRONT (F.Cu). Faded marker and dashed outline = pad on the BACK (B.Cu).</text>
<text x="10" y="260.9" font-size="2.7" fill="#667">The dashed line is the connection to MAKE, not a route to follow -- take whatever path the board allows.</text>
<text x="10" y="264.9" font-size="2.7" fill="#667">A floating ground needs a via beside the pad, landing in the plane on the other layer, plus a short track to it.</text>
<text x="10" y="268.9" font-size="2.7" fill="#667">Board 36.1 x 58.1 mm, drawn at 4x. Ground pour islands are not shown.</text>
